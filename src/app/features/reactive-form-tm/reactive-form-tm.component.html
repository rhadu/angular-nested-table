<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div>
    <label for="email">Mail address:</label>
    <input id="email" type="email" formControlName="email" />
    <div *ngIf="form.controls.email.invalid && form.controls.email.touched">
      Please enter a valid email address.
    </div>
  </div>

  <div>
    <label for="subscription">Subscription:</label>
    <select id="subscription" formControlName="subscription">
      <option *ngFor="let sub of subscriptions" [value]="sub">{{ sub }}</option>
    </select>
  </div>

  <div>
    <label for="password">Password:</label>
    <input id="password" type="password" formControlName="password" />
    <div
      *ngIf="form.controls.password.invalid && form.controls.password.touched"
    >
      Password is required.
    </div>
  </div>

  <button type="submit" [disabled]="form.invalid">Submit</button>
</form>

<div *ngIf="form.invalid && form.touched">
  Please correct the errors in the form.
</div>
